Metadata:
	Title: mod-title
	Version: release-20250330
	Website: https://www.openra.net
	WebIcon32: https://www.openra.net/images/icons/cnc_32x32.png
	WindowTitle: mod-windowtitle

PackageFormats: Mix

FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$tdo: tdo
		^EngineDir|mods/common: common
		^EngineDir|mods/cnc
		~^SupportDir|Content/cnc: content
		common|scripts
		tdo|uibits
	ContentPackages:
		content|speech.mix
		content|conquer.mix
		content|sounds.mix
		content|tempicnh.mix
		content|temperat.mix
		content|winter.mix
		content|desert.mix
		~content|movies
		~content|scores.mix
		~content|scores2.mix
		~content|scores-covertops.mix
		~content|transit.mix
		~content|general.mix
		# Mod-provided packages that must be mounted after the content packages so they can override content assets.
		# NOTE: a ContentPackages entry that fails to mount (and has no '~') triggers the content installer,
		# so every non-~ path below has to exist on disk (assets/icons/ra/small and assets/projectiles do not
		# exist in git today -> they are marked optional with ~).
		tdo|assets/palettes
		tdo|assets/icons/ra/large
		~tdo|assets/icons/ra/small
		tdo|assets/icons/td/large
		tdo|assets/icons/td/small
		~tdo|assets/projectiles
		tdo|assets/actors/ra
		tdo|assets/actors/td
		tdo|assets/sounds/ra
		tdo|assets/sounds/td
		tdo|assets/sounds/chat
		tdo|assets/sounds/td/dinos
		tdo|assets/sounds/td/scounds
		tdo|assets/sounds/td/sounds
		tdo|assets/sounds/td/speech
		tdo|assets/ss
		tdo|assets/system
		tdo|assets/terrain/snow/snow.mix
		tdo|assets/terrain/snow
		tdo|assets/terrain/jungle
		tdo|assets/terrain/desert
		tdo|assets/terrain/temperat
		tdo|assets/terrain/winter
		tdo|assets/terrain/tempera
		tdo|assets/terrain/interior/interior.mix
		tdo|assets/terrain/interior
	ContentInstallerMod: tdo-content

