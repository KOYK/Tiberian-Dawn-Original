		ResetOnOwnerChange:	False
		RequiresCondition: enable-all-bot
	GrantConditionOnFaction@GDI:
		Condition: gdi
		Factions: gdi
		ResetOnOwnerChange:	False
		RequiresCondition: enable-all-bot
