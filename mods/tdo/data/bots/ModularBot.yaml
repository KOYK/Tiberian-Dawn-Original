E1.scout:
	Inherits: E1
	RenderSprites:
		Image: e1
	Buildable:
		Prerequisites: ~barracks, ~tl1, ~!e2.scout, ~BotOwner
		BuildLimit: 1
	AttackWander:
		WanderMoveRadius: 40
	ProvidesPrerequisite@unitname:
		Prerequisite: e1.scout
	RejectsOrders:

E2.scout:
	Inherits: E2
	RenderSprites:
		Image: e2
	Buildable:
		Prerequisites: ~pyle, ~tl2, ~!e1.scout, ~BotOwner
		BuildLimit: 1
	AttackWander:
		WanderMoveRadius: 40
	ProvidesPrerequisite@unitname:
		Prerequisite: e2.scout
	RejectsOrders:

