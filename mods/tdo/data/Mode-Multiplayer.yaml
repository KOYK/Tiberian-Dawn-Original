^DefaultTooltipColorPrimary:
	Tooltip:
		GenericStancePrefix: True
		NeutralPrefix: Civilian
		AllyPrefix: Friendly
		EnemyPrefix: Enemy
		GenericVisibility: Neutral, Enemy
		ShowOwnerRow: false
	RenderSprites:
		PlayerPalette: player-units

^DefaultTooltipColorSecondary:
	Tooltip:
		GenericStancePrefix: True
		NeutralPrefix: Civilian
		AllyPrefix: Friendly
		EnemyPrefix: Enemy
		GenericVisibility: Neutral, Enemy
		ShowOwnerRow: false
	RenderSprites:
		PlayerPalette: player

^Vehicle:
	Inherits@DPC: ^DefaultTooltipColorPrimary
^Tank:
	Inherits@DPC: ^DefaultTooltipColorPrimary
^Helicopter:
	Inherits@DPC: ^DefaultTooltipColorPrimary
^Infantry:
	Inherits@DPC: ^DefaultTooltipColorPrimary
	WithDeathAnimation:
		DeathSequencePalette: player-units
^CommonHuskDefaults:
	Inherits@DPC: ^DefaultTooltipColorPrimary
C17:
	Inherits@DPC: ^DefaultTooltipColorPrimary
^Plane:
	Inherits@DPC: ^DefaultTooltipColorPrimary
^Ship:
	Inherits@DPC: ^DefaultTooltipColorPrimary


HARV:
	Inherits@DPC: ^DefaultTooltipColorSecondary
MCV:
	Inherits@DPC: ^DefaultTooltipColorSecondary
HARV.Husk:
	Inherits@DPC: ^DefaultTooltipColorSecondary
MCV.Husk:
	Inherits@DPC: ^DefaultTooltipColorSecondary
^Building:
	Inherits@DPC: ^DefaultTooltipColorSecondary

^Wall:
	Tooltip:
		ShowOwnerRow: false

^CivBuilding:
	Tooltip:
		GenericVisibility: Enemy, Neutral
		ShowOwnerRow: false

^CivBuildingHusk:
	Tooltip:
		GenericVisibility: Enemy, Neutral
		ShowOwnerRow: false

^TechBuilding:
	Tooltip:
		GenericVisibility: None
		ShowOwnerRow: false

^CommonHuskDefaults:
	Tooltip:
		GenericVisibility: Enemy, Ally, Neutral
		GenericStancePrefix: false
		ShowOwnerRow: false

^DINO:
	Tooltip:
		ShowOwnerRow: false

MISS:
	Tooltip:
		GenericVisibility: None
		ShowOwnerRow: False

ARCO:
	Tooltip:
		GenericVisibility: None
		ShowOwnerRow: False

